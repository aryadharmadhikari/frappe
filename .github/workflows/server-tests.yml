name: Server

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"

concurrency:
  group: server-${{ github.event_name }}-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  # Do not change this as GITHUB_TOKEN is being used by roulette
  contents: read
  actions: read

jobs:
  checkrun:
    name: Plan Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'Skip CI') || contains(github.event.pull_request.labels.*.name, 'Run Server Tests') || contains(github.event.pull_request.labels.*.name, 'run-full-ci') || contains(github.event.pull_request.labels.*.name, 'fixes-develop') }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check-build.outputs.build }}
      run_postgres: ${{ steps.check-build.outputs.run_postgres }}
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Select server tests
        id: check-build
        run: |
          python "${GITHUB_WORKSPACE}/.github/helper/roulette.py"
        env:
          TYPE: "server"
          SKIP_ON_PRS: "true"
          PR_NUMBER: ${{ github.event.number }}
          REPO_NAME: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  setup:
    name: Setup (${{ matrix.db }})
    needs: checkrun
    if: ${{ needs.checkrun.outputs.build == 'strawberry' }}
    runs-on: ubuntu-latest
    env: &server-environment
      NODE_ENV: "production"
      PYTHONWARNINGS: "module,ignore:::babel.messages.extract"
      DB_ROOT_PASSWORD: db_root
    strategy:
      fail-fast: false
      matrix:
        db: &databases ${{ fromJson(needs.checkrun.outputs.run_postgres == 'true' && '["mariadb", "postgres"]' || '["mariadb"]') }}
    services:
      postgres: &postgres-service
        image: ${{ matrix.db == 'postgres' && 'postgres:18.0' || '' }}
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: travis
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb: &mariadb-service
        image: mariadb:11.8
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3 --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
    steps:
      - &prepared-bench-key
        name: Compute prepared bench cache key
        id: prepared-bench-key
        env:
          DB: ${{ matrix.db }}
        run: echo "key=prepared-bench-v2-$(lsb_release -rs)-$RUNNER_ARCH-$DB-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Check prepared bench cache
        id: prepared-bench-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/prepared-bench
          key: ${{ steps.prepared-bench-key.outputs.key }}
          lookup-only: true

      - uses: actions/checkout@v7
        if: steps.prepared-bench-cache.outputs.cache-hit != 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        name: Environment Setup
        if: steps.prepared-bench-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.14'
          node-version: 24
          disable-socketio: true
          db-root-password: ${{ env.DB_ROOT_PASSWORD }}
          db: ${{ matrix.db }}
        env:
          PYTHONWARNINGS: "ignore:Unimplemented abstract methods {'locate_file'}:DeprecationWarning"

      - name: Save prepared bench
        if: steps.prepared-bench-cache.outputs.cache-hit != 'true'
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/prepared-bench
          DB: ${{ matrix.db }}
        run: bash .github/helper/save-prepared-bench.sh

      - name: Cache prepared bench
        if: steps.prepared-bench-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/prepared-bench
          key: ${{ steps.prepared-bench-key.outputs.key }}

      - name: Show bench output
        if: always() && steps.prepared-bench-cache.outputs.cache-hit != 'true'
        run: cat bench_start.log || true

  test:
    name: Integration
    needs: [checkrun, setup]
    if: ${{ needs.checkrun.outputs.build == 'strawberry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: *server-environment

    strategy:
      fail-fast: false
      matrix:
        db: *databases
        index: [1, 2, 3, 4]
    services:
      postgres: *postgres-service
      mariadb: *mariadb-service
      smtp_server:
        image: rnwood/smtp4dev:3.7.1
        ports:
          - 2525:25
          - 3000:80
    steps:
      - uses: actions/checkout@v7

      - *prepared-bench-key

      - name: Restore prepared bench cache
        id: prepared-bench-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/prepared-bench
          key: ${{ steps.prepared-bench-key.outputs.key }}

      - uses: ./.github/actions/setup
        name: Prepare integration environment
        with:
          disable-socketio: true
          db-root-password: ${{ env.DB_ROOT_PASSWORD }}
          db: ${{ matrix.db }}
          prepared-bench-path: ${{ steps.prepared-bench-cache.outputs.cache-hit == 'true' && format('{0}/prepared-bench', runner.temp) || '' }}
        env:
          PYTHONWARNINGS: "ignore:Unimplemented abstract methods {'locate_file'}:DeprecationWarning"

      - name: Run Tests
        run: |
          cd sites && ../env/bin/python3 ../apps/frappe/.github/helper/ci.py
        env:
          DB: ${{ matrix.db }}
          # consumed by bench run-parallel-tests
          CAPTURE_COVERAGE: true
          BUILD_NUMBER: ${{ matrix.index }}
          TOTAL_BUILDS: 4
          FRAPPE_SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.db }}-${{ matrix.index }}
          path: ./sites/*coverage*.xml

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() && contains( github.event.pull_request.labels.*.name, 'debug-gha') }}

      - name: Show bench output
        if: ${{ always() }}
        run: bash .github/helper/show-bench-logs.sh

  migrate:
    name: Migration
    needs: checkrun
    if: ${{ needs.checkrun.outputs.build == 'strawberry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONWARNINGS: "ignore"
      DB_ROOT_PASSWORD: db_root
    services:
      mariadb: *mariadb-service
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        name: Environment Setup
        with:
          python-version: '3.14'
          node-version: 24
          disable-socketio: true
          disable-web: true
          db-root-password: ${{ env.DB_ROOT_PASSWORD }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: |
            3.13
            3.14

      - name: Download database artifact
        env:
          DB_ARTIFACT_URL: https://frappe.io/files/v14-frappe.sql.gz
        run: bash .github/helper/test-server-migration.sh restore

      - name: Update to v15
        run: bash .github/helper/test-server-migration.sh 15 3.13

      - name: Update to v16
        run: bash .github/helper/test-server-migration.sh 16

      - name: Update to last commit
        run: bash .github/helper/test-server-migration.sh

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() && contains( github.event.pull_request.labels.*.name, 'debug-gha') }}

      - name: Show bench output
        if: ${{ always() }}
        run: bash .github/helper/show-bench-logs.sh

  coverage:
    name: Coverage Wrap Up
    needs: [test, checkrun]
    if: ${{ needs.checkrun.outputs.build == 'strawberry' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Download coverage data
        uses: actions/download-artifact@v8.0.2
      - name: Upload coverage data
        uses: codecov/codecov-action@v7
        with:
          name: Server
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: server

  # TIP: Require this single check in branch protection, e.g. Server / Success
  success:
    name: Server Success
    needs: [setup, test, migrate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tests '${{ needs.test.result }}' / Migration '${{ needs.migrate.result }}'
        shell: python
        run: |
          stati = [
            '${{ needs.setup.result }}',
            '${{ needs.test.result }}',
            '${{ needs.migrate.result }}',
          ]

          nopass = ["failure", "cancelled"]
          dopass = ["success", "skipped"]
          if any(r in nopass for r in stati):
            exit(1)
          if all(r in dopass for r in stati):
            exit(0)
          exit(1)

  develop-status:
    name: Update Develop Status
    needs: success
    if: ${{ always() && github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/develop", "refs/heads/desk-v2"]'), github.ref) }}
    runs-on: ubuntu-latest
    concurrency:
      group: develop-status-all
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/helper
      - run: python .github/helper/develop_status.py refresh
        env:
          GH_TOKEN: ${{ github.token }}
